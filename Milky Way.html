<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  canvas { display: block; }

  #ui {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    user-select: none;
  }

  #title {
    color: rgba(160, 180, 255, 0.7);
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(120, 160, 255, 0.8);
  }

  #hint {
    color: rgba(255, 255, 255, 0.2);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #glow-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(80, 60, 180, 0.08) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse-glow 4s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="glow-overlay"></div>

<div id="ui">
  <div id="title">Milky Way — 100,000 Stars</div>
  <div id="hint">drag to rotate &nbsp;·&nbsp; scroll to zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── RENDERER ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000005, 1);
document.body.appendChild(renderer.domElement);

// ─── SCENE & CAMERA ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 28, 55);
camera.lookAt(0, 0, 0);

// ─── GALAXY PARAMETERS ──────────────────────────────────────────────────────
const PARTICLES   = 100000;
const ARMS        = 5;
const RADIUS      = 42;
const SPIN        = 1.5;    // spiral tightness
const RANDOMNESS  = 0.55;
const CORE_RADIUS = 3.5;

const positions = new Float32Array(PARTICLES * 3);
const colors    = new Float32Array(PARTICLES * 3);
const sizes     = new Float32Array(PARTICLES);

const c = new THREE.Color();

for (let i = 0; i < PARTICLES; i++) {
  const i3 = i * 3;

  // Radius: more dense toward center
  const r = Math.pow(Math.random(), 0.6) * RADIUS;

  // Arm angle + spin offset
  const armIndex    = Math.floor(Math.random() * ARMS);
  const armAngle    = (armIndex / ARMS) * Math.PI * 2;
  const spinAngle   = r * SPIN * 0.08;
  const randomAngle = (Math.random() - 0.5) * (RANDOMNESS * (1 + r / RADIUS));

  const finalAngle  = armAngle + spinAngle + randomAngle;

  // Scatter around the galactic plane
  const scatterY    = (Math.random() - 0.5) * Math.pow(1 - r / RADIUS, 2) * 4;
  const scatterR    = (Math.random() - 0.5) * 0.6;

  positions[i3]     = Math.cos(finalAngle) * (r + scatterR);
  positions[i3 + 1] = scatterY;
  positions[i3 + 2] = Math.sin(finalAngle) * (r + scatterR);

  // ── Color mapping ──
  const t = r / RADIUS;

  if (t < 0.05) {
    // Blazing hot core – pale gold-white
    c.setRGB(1.0, 0.97, 0.85);
  } else if (t < 0.15) {
    // Inner disk – warm blue-white
    c.setRGB(0.90, 0.85, 1.0);
  } else if (t < 0.35) {
    // Mid arms – bright electric blue
    c.setRGB(0.45, 0.60, 1.0);
  } else if (t < 0.65) {
    // Outer arms – teal/cyan
    c.setRGB(0.25, 0.70, 0.95);
  } else {
    // Far edge – deep violet / magenta
    c.setRGB(0.60, 0.25, 0.85);
  }

  // Fine-grain noise so no two stars look the same
  colors[i3]     = Math.min(1, c.r + (Math.random() - 0.5) * 0.18);
  colors[i3 + 1] = Math.min(1, c.g + (Math.random() - 0.5) * 0.18);
  colors[i3 + 2] = Math.min(1, c.b + (Math.random() - 0.5) * 0.18);

  // Bigger stars near the core
  sizes[i] = t < 0.1 ? 2.0 + Math.random() * 1.5 : 0.6 + Math.random() * 1.0;
}

// ─── GALAXY MESH ────────────────────────────────────────────────────────────
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

// Custom shader material for glowing round points
const galaxyMat = new THREE.ShaderMaterial({
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.0, 0.5, d);
      alpha = pow(alpha, 1.4);
      gl_FragColor = vec4(vColor * 1.6, alpha * 0.9);
    }
  `
});

const galaxy = new THREE.Points(geo, galaxyMat);
scene.add(galaxy);

// ─── GLOWING CORE ───────────────────────────────────────────────────────────
// Layered spheres to fake bloom
const coreLayers = [
  { r: 0.5,  color: 0xfff5cc, opacity: 1.0  },
  { r: 1.2,  color: 0xeeddff, opacity: 0.5  },
  { r: 2.6,  color: 0x8888ff, opacity: 0.18 },
  { r: 5.0,  color: 0x4444cc, opacity: 0.08 },
  { r: 10.0, color: 0x220055, opacity: 0.04 },
];

const coreGroup = new THREE.Group();
coreLayers.forEach(({ r, color, opacity }) => {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 32, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  coreGroup.add(mesh);
});
scene.add(coreGroup);

// ─── BACKGROUND STAR FIELD ──────────────────────────────────────────────────
const bgCount = 8000;
const bgPos   = new Float32Array(bgCount * 3);
const bgCol   = new Float32Array(bgCount * 3);

for (let i = 0; i < bgCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const rad   = 300 + Math.random() * 400;

  bgPos[i*3]     = rad * Math.sin(phi) * Math.cos(theta);
  bgPos[i*3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
  bgPos[i*3 + 2] = rad * Math.cos(phi);

  const warmth = Math.random();
  bgCol[i*3]     = 0.7 + warmth * 0.3;
  bgCol[i*3 + 1] = 0.7 + (Math.random() - 0.5) * 0.2;
  bgCol[i*3 + 2] = 0.85 + (1 - warmth) * 0.15;
}

const bgGeo = new THREE.BufferGeometry();
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
bgGeo.setAttribute('color',    new THREE.BufferAttribute(bgCol, 3));

const bgMat = new THREE.PointsMaterial({
  size: 0.55,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

scene.add(new THREE.Points(bgGeo, bgMat));

// ─── DUST CLOUD LAYER ───────────────────────────────────────────────────────
const dustCount = 8000;
const dustPos   = new Float32Array(dustCount * 3);
const dustCol   = new Float32Array(dustCount * 3);
const dustSizes = new Float32Array(dustCount);

for (let i = 0; i < dustCount; i++) {
  const r     = Math.pow(Math.random(), 0.7) * RADIUS * 0.9;
  const angle = Math.random() * Math.PI * 2;

  dustPos[i*3]     = Math.cos(angle) * r + (Math.random() - 0.5) * 6;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 2.5;
  dustPos[i*3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * 6;

  const t = r / RADIUS;
  dustCol[i*3]     = 0.3 + t * 0.3;
  dustCol[i*3 + 1] = 0.2 + (1 - t) * 0.2;
  dustCol[i*3 + 2] = 0.5 + (1 - t) * 0.4;

  dustSizes[i] = 2 + Math.random() * 5;
}

const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color',    new THREE.BufferAttribute(dustCol, 3));
dustGeo.setAttribute('size',     new THREE.BufferAttribute(dustSizes, 1));

const dustMat = new THREE.ShaderMaterial({
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.0, 0.5, d);
      alpha = pow(alpha, 2.5);
      gl_FragColor = vec4(vColor, alpha * 0.12);
    }
  `
});

const dustCloud = new THREE.Points(dustGeo, dustMat);
scene.add(dustCloud);

// ─── MOUSE / TOUCH INTERACTION ──────────────────────────────────────────────
let isDragging = false;
let prevMouse  = { x: 0, y: 0 };
let targetRotX = 0.35;
let targetRotY = 0;
let currentRotX = 0.35;
let currentRotY = 0;
let cameraZoom  = 55;
let targetZoom  = 55;

const onDown  = e => { isDragging = true; const p = e.touches ? e.touches[0] : e; prevMouse = { x: p.clientX, y: p.clientY }; };
const onUp    = () => isDragging = false;
const onMove  = e => {
  if (!isDragging) return;
  const p = e.touches ? e.touches[0] : e;
  targetRotY += (p.clientX - prevMouse.x) * 0.004;
  targetRotX += (p.clientY - prevMouse.y) * 0.003;
  targetRotX  = Math.max(-1.2, Math.min(1.2, targetRotX));
  prevMouse   = { x: p.clientX, y: p.clientY };
};

renderer.domElement.addEventListener('mousedown',  onDown);
renderer.domElement.addEventListener('touchstart', onDown, { passive: true });
document.addEventListener('mouseup',   onUp);
document.addEventListener('touchend',  onUp);
document.addEventListener('mousemove', onMove);
document.addEventListener('touchmove', onMove, { passive: true });

document.addEventListener('wheel', e => {
  targetZoom = Math.max(12, Math.min(130, targetZoom + e.deltaY * 0.04));
}, { passive: true });

// ─── RESIZE ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── ANIMATION LOOP ─────────────────────────────────────────────────────────
let clock = 0;
const AUTO_ROT_SPEED = 0.0012;

function animate() {
  requestAnimationFrame(animate);
  clock += 0.01;

  // Auto-rotate when not dragging
  if (!isDragging) targetRotY += AUTO_ROT_SPEED;

  // Smooth lerp toward targets
  currentRotX += (targetRotX - currentRotX) * 0.06;
  currentRotY += (targetRotY - currentRotY) * 0.06;
  cameraZoom  += (targetZoom  - cameraZoom)  * 0.06;

  // Apply to galaxy & dust
  galaxy.rotation.x    = currentRotX;
  galaxy.rotation.y    = currentRotY;
  dustCloud.rotation.x = currentRotX;
  dustCloud.rotation.y = currentRotY + clock * 0.003; // slightly offset rotation

  // Pulsing core glow
  const pulse = 0.9 + Math.sin(clock * 0.7) * 0.1;
  coreGroup.scale.setScalar(pulse);
  coreGroup.rotation.y = currentRotY * 0.3; // subtle follow

  // Move camera
  camera.position.set(0, cameraZoom * 0.45, cameraZoom);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
