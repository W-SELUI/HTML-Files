<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempest</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      body.live {
        cursor: none;
      }
      canvas {
        display: block;
      }
      /* ---------- camera box (bottom-right) ---------- */
      #camBox {
        position: fixed;
        right: 18px;
        bottom: 18px;
        width: 220px;
        aspect-ratio: 4 / 3;
        border: 1px solid rgba(59, 130, 246, 0.35);
        box-shadow: 0 0 22px rgba(59, 130, 246, 0.18);
        border-radius: 6px;
        overflow: hidden;
        background: #02060d;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 1s ease,
          transform 1s ease;
        z-index: 3;
      }
      #camBox.show {
        opacity: 1;
        transform: none;
      }
      #camBox video,
      #camBox canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* mirror, like a selfie */
      }
      #camBox video {
        filter: grayscale(0.6) brightness(0.75) contrast(1.1);
      }
      #camBox .tag {
        position: absolute;
        left: 8px;
        top: 6px;
        color: #7fa6d6;
        font-size: 9px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        z-index: 2;
      }
      #camBox .tag::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 6px;
        border-radius: 50%;
        background: #3b82f6;
        box-shadow: 0 0 8px #3b82f6;
        vertical-align: 1px;
      }

      /* ---------- start screen ---------- */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.85)
        );
        transition: opacity 1.6s ease;
        z-index: 2;
      }
      #overlay.gone {
        opacity: 0;
        pointer-events: none;
      }
      #overlay h1 {
        margin: 0;
        color: #cfe3ff;
        font-weight: 200;
        font-size: clamp(42px, 9vw, 110px);
        letter-spacing: 0.45em;
        padding-left: 0.45em;
        text-shadow: 0 0 30px rgba(59, 130, 246, 0.45);
      }
      #overlay p {
        margin: 0;
        color: #5f7fa6;
        font-size: 13px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-align: center;
        line-height: 2;
      }
      #enter {
        margin-top: 22px;
        background: transparent;
        color: #9cc2f0;
        border: 1px solid rgba(59, 130, 246, 0.45);
        padding: 14px 38px;
        font-size: 13px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.35s ease;
      }
      #enter:hover {
        color: #fff;
        border-color: #3b82f6;
        box-shadow:
          0 0 28px rgba(59, 130, 246, 0.55),
          inset 0 0 18px rgba(59, 130, 246, 0.25);
      }

      #status {
        position: fixed;
        left: 18px;
        bottom: 14px;
        color: #3d5a7d;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: opacity 1.2s ease;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <canvas id="sea"></canvas>
    <div id="camBox">
      <span class="tag">live</span>
      <video id="cam" playsinline muted></video>
      <canvas id="camDots" width="320" height="240"></canvas>
    </div>

    <div id="overlay">
      <h1>TEMPEST</h1>
      <p>
        move your hand through the sea<br />close your fist to call the
        lightning<br />open palm to press the ocean · two hands to open the
        whirlpool
      </p>
      <button id="enter">Enter the storm</button>
    </div>
    <div id="status"></div>

    <script type="module">
      const VISION_URL =
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

      const WASM_URL =
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
      const MODEL_URL =
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

      /* =========================================================
   SETUP
   ========================================================= */
      const canvas = document.getElementById("sea");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("cam");
      const overlay = document.getElementById("overlay");
      const statusEl = document.getElementById("status");
      const camBox = document.getElementById("camBox");
      const dotsCv = document.getElementById("camDots");
      const dctx = dotsCv.getContext("2d");

      let W = 0,
        H = 0,
        DPR = 1,
        HORIZON = 0;

      // ocean grid (rows go from near -> far)
      const ROWS = 80,
        Z_NEAR = 1,
        Z_FAR = 16,
        CAM = 0.62;
      const SPRING = 0.035,
        DAMP = 0.9;
      let COLS = 0,
        N = 0;
      let pu, pz, prow, ox, oy, vx, vy, px, py, psz, plv;

      // colour levels: near-black navy -> electric blue -> white
      const COLORS = [
        "#040b16",
        "#071427",
        "#0b203d",
        "#113056",
        "#1a4778",
        "#2c6aa3",
        "#5b9fd6",
        "#cde9ff",
      ];

      function buildOcean() {
        COLS = Math.round(Math.min(230, Math.max(110, W / 6.5)));
        N = COLS * ROWS;
        pu = new Float32Array(N);
        pz = new Float32Array(N);
        prow = new Float32Array(N);
        ox = new Float32Array(N);
        oy = new Float32Array(N);
        vx = new Float32Array(N);
        vy = new Float32Array(N);
        px = new Float32Array(N);
        py = new Float32Array(N);
        psz = new Float32Array(N);
        plv = new Uint8Array(N);

        let i = 0;
        for (let r = 0; r < ROWS; r++) {
          const z = Z_NEAR * Math.pow(Z_FAR / Z_NEAR, r / (ROWS - 1));
          for (let c = 0; c < COLS; c++) {
            pu[i] = (c + (r % 2) * 0.5 + (Math.random() - 0.5) * 0.6) / COLS;
            pz[i] = z * (1 + (Math.random() - 0.5) * 0.02);
            prow[i] = r / (ROWS - 1);
            i++;
          }
        }
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 1.5);
        W = innerWidth;
        H = innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        HORIZON = H * 0.36;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        buildOcean();
      }
      addEventListener("resize", resize);
      resize();

      /* =========================================================
   WORLD STATE
   ========================================================= */
      let t = 0,
        storm = 0,
        flash = 0,
        skyFlash = 0,
        shake = 0;
      let vortexS = 0,
        vortex = { x: 0, y: 0, r: 0 };
      let startTime = performance.now(),
        entered = false,
        enteredAt = 0;
      let nextDistant = performance.now() + 4000;

      const bolts = [];
      const shocks = [];
      const spray = [];
      const rain = [];
      for (let i = 0; i < 340; i++) {
        rain.push({
          x: Math.random() * W * 1.3,
          y: Math.random() * H,
          l: 8 + Math.random() * 20,
          s: 9 + Math.random() * 9,
        });
      }

      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

      /* =========================================================
   HANDS (camera) + MOUSE FALLBACK
   ========================================================= */
      function makeHand() {
        return {
          active: false,
          missing: 0,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          speed: 0,
          size: 60,
          fist: false,
          open: false,
          press: 0,
        };
      }
      const hands = [makeHand(), makeHand()];
      const mouse = Object.assign(makeHand(), { tx: 0, ty: 0, lastMove: -1e9 });

      let landmarker = null,
        camReady = false,
        lastVideoTime = -1;

      function status(msg, hideAfter) {
        statusEl.textContent = msg;
        statusEl.style.opacity = 1;
        if (hideAfter)
          setTimeout(() => (statusEl.style.opacity = 0), hideAfter);
      }

      async function initHands() {
        try {
          status("waking the storm…");
          // loaded here so the ocean still runs even if the CDN is slow or offline
          const { FilesetResolver, HandLandmarker } = await import(VISION_URL);
          const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
          const opts = (delegate) => ({
            baseOptions: { modelAssetPath: MODEL_URL, delegate },
            runningMode: "VIDEO",
            numHands: 2,
            minHandDetectionConfidence: 0.5,
            minHandPresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
          try {
            landmarker = await HandLandmarker.createFromOptions(
              fileset,
              opts("GPU"),
            );
          } catch {
            landmarker = await HandLandmarker.createFromOptions(
              fileset,
              opts("CPU"),
            );
          }

          status("allow the camera to call the storm");
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: "user" },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          camReady = true;
          camBox.classList.add("show");
          status("the storm is listening · show your hands", 6000);
        } catch (err) {
          console.warn(err);
          status("no camera · use your mouse (click = lightning)", 9000);
        }
      }

      // landmark (0..1, mirrored) -> screen. 1.3x so your hand reaches the edges easily
      function toScreen(lm) {
        return {
          x: (1 - lm.x - 0.5) * 1.3 * W + W / 2,
          y: (lm.y - 0.5) * 1.3 * H + H / 2,
        };
      }

      function readHand(lm) {
        const pts = lm.map(toScreen);
        const palmIds = [0, 5, 9, 13, 17];
        let cx = 0,
          cy = 0;
        for (const id of palmIds) {
          cx += pts[id].x;
          cy += pts[id].y;
        }
        cx /= 5;
        cy /= 5;
        const wrist = pts[0];
        const size = Math.hypot(pts[9].x - wrist.x, pts[9].y - wrist.y) || 1;
        let tipDist = 0;
        for (const id of [8, 12, 16, 20])
          tipDist += Math.hypot(pts[id].x - wrist.x, pts[id].y - wrist.y);
        const ratio = tipDist / 4 / size; // ~1.8 open hand, ~1.0 fist
        return { x: cx, y: cy, size, ratio };
      }

      function updateHand(h, d) {
        if (!h.active) {
          h.x = d.x;
          h.y = d.y;
          h.vx = h.vy = 0;
          h.speed = 0;
          h.fist = false;
          h.size = d.size;
        }
        h.active = true;
        h.missing = 0;
        const nx = h.x + (d.x - h.x) * 0.6;
        const ny = h.y + (d.y - h.y) * 0.6;
        h.vx = nx - h.x;
        h.vy = ny - h.y;
        h.x = nx;
        h.y = ny;
        h.size += (d.size - h.size) * 0.3;
        h.speed += (Math.hypot(h.vx, h.vy) - h.speed) * 0.35;

        const wasFist = h.fist;
        if (!h.fist && d.ratio < 1.2) h.fist = true;
        else if (h.fist && d.ratio > 1.45) h.fist = false;
        h.open = d.ratio > 1.6;
        if (h.fist && !wasFist) strike(h.x, h.y);
      }

      // hand skeleton drawn on top of the little camera box
      const BONES = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [17, 18],
        [18, 19],
        [19, 20],
        [0, 17],
      ];
      function drawCamDots(all) {
        const w = dotsCv.width,
          h = dotsCv.height;
        dctx.clearRect(0, 0, w, h);
        all.slice(0, 2).forEach((lm, n) => {
          const fist = hands[n] && hands[n].fist;
          dctx.strokeStyle = fist
            ? "rgba(255,255,255,0.9)"
            : "rgba(90,160,255,0.85)";
          dctx.lineWidth = 1.5;
          dctx.beginPath();
          for (const [a, b] of BONES) {
            dctx.moveTo(lm[a].x * w, lm[a].y * h);
            dctx.lineTo(lm[b].x * w, lm[b].y * h);
          }
          dctx.stroke();
          dctx.fillStyle = fist ? "#ffffff" : "#bfe0ff";
          for (const p of lm) dctx.fillRect(p.x * w - 1.5, p.y * h - 1.5, 3, 3);
        });
      }

      function detect(now) {
        if (
          !camReady ||
          video.readyState < 2 ||
          video.currentTime === lastVideoTime
        )
          return;
        lastVideoTime = video.currentTime;
        const res = landmarker.detectForVideo(video, now);
        drawCamDots(res.landmarks || []);
        const found = (res.landmarks || []).slice(0, 2).map(readHand);

        if (found.length === 2) {
          found.sort((a, b) => a.x - b.x);
          updateHand(hands[0], found[0]);
          updateHand(hands[1], found[1]);
        } else if (found.length === 1) {
          // give the single hand to whichever slot it is closest to
          const d = found[0];
          let slot = 0;
          if (
            hands[1].active &&
            (!hands[0].active ||
              Math.hypot(hands[1].x - d.x, hands[1].y - d.y) <
                Math.hypot(hands[0].x - d.x, hands[0].y - d.y))
          )
            slot = 1;
          updateHand(hands[slot], d);
          const other = hands[1 - slot];
          if (++other.missing > 6) other.active = false;
        } else {
          for (const h of hands) if (++h.missing > 6) h.active = false;
        }
      }

      addEventListener("mousemove", (e) => {
        mouse.tx = e.clientX;
        mouse.ty = e.clientY;
        mouse.lastMove = performance.now();
      });
      addEventListener("mousedown", (e) => {
        if (!entered) return;
        if (!hands[0].active && !hands[1].active) strike(e.clientX, e.clientY);
      });

      function updateMouse(now) {
        const camHands = hands[0].active || hands[1].active;
        if (camHands || now - mouse.lastMove > 2500 || !entered) {
          mouse.active = false;
          mouse.speed *= 0.8;
          return;
        }
        if (!mouse.active) {
          mouse.x = mouse.tx;
          mouse.y = mouse.ty;
        }
        mouse.active = true;
        const nx = mouse.x + (mouse.tx - mouse.x) * 0.5;
        const ny = mouse.y + (mouse.ty - mouse.y) * 0.5;
        mouse.vx = nx - mouse.x;
        mouse.vy = ny - mouse.y;
        mouse.x = nx;
        mouse.y = ny;
        mouse.speed +=
          (Math.hypot(mouse.vx, mouse.vy) * 0.6 - mouse.speed) * 0.3;
        mouse.size = 50;
      }

      const activeHands = () =>
        [hands[0], hands[1], mouse].filter((h) => h.active);

      /* =========================================================
   LIGHTNING
   ========================================================= */
      function boltPath(x1, y1, x2, y2, disp, depth) {
        let pts = [
          { x: x1, y: y1 },
          { x: x2, y: y2 },
        ];
        for (let k = 0; k < depth; k++) {
          const np = [pts[0]];
          for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i],
              b = pts[i + 1];
            np.push({
              x: (a.x + b.x) / 2 + (Math.random() - 0.5) * disp,
              y: (a.y + b.y) / 2 + (Math.random() - 0.5) * disp * 0.25,
            });
            np.push(b);
          }
          pts = np;
          disp *= 0.55;
        }
        return pts;
      }

      function makeBolt(x1, y1, x2, y2, power) {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const main = boltPath(x1, y1, x2, y2, len * 0.35, 7);
        const branches = [];
        const nb = 2 + Math.floor(Math.random() * 3 * power);
        for (let k = 0; k < nb; k++) {
          const s = main[Math.floor(Math.random() * main.length * 0.75)];
          const ang = Math.PI / 2 + (Math.random() - 0.5) * 1.8;
          const bl = len * (0.12 + Math.random() * 0.25);
          branches.push(
            boltPath(
              s.x,
              s.y,
              s.x + Math.cos(ang) * bl,
              s.y + Math.sin(ang) * bl,
              bl * 0.45,
              5,
            ),
          );
        }
        return { main, branches, life: 1, power };
      }

      function strike(x, y) {
        bolts.push(makeBolt(x + (Math.random() - 0.5) * W * 0.3, -30, x, y, 1));
        flash = 1;
        shake = 1;
        storm = Math.min(1, storm + 0.45);
        shocks.push({ x, y, r: 10, str: 7 });
        if (y > HORIZON - 20) {
          for (let k = 0; k < 160; k++) {
            const a = -Math.PI * Math.random();
            const sp = 3 + Math.random() * 13;
            spray.push({
              x,
              y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp - 2,
              life: 1,
              decay: 0.01 + Math.random() * 0.02,
            });
          }
        }
      }

      function distantLightning(now) {
        if (now < nextDistant) return;
        nextDistant = now + (2500 + Math.random() * 7000) * (1 - storm * 0.6);
        const x = Math.random() * W;
        bolts.push(
          makeBolt(
            x,
            -10,
            x + (Math.random() - 0.5) * 120,
            HORIZON - Math.random() * H * 0.08,
            0.32,
          ),
        );
        skyFlash = 0.5 + Math.random() * 0.4;
      }

      function strokePath(p) {
        ctx.beginPath();
        ctx.moveTo(p[0].x, p[0].y);
        for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
        ctx.stroke();
      }

      function drawBolts() {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = bolts.length - 1; i >= 0; i--) {
          const b = bolts[i];
          const a = b.life * (Math.random() < 0.25 ? 0.3 : 1);
          const p = b.power;
          ctx.strokeStyle = `rgba(80,140,255,${a * 0.22})`;
          ctx.lineWidth = 16 * p;
          strokePath(b.main);
          ctx.strokeStyle = `rgba(160,205,255,${a * 0.5})`;
          ctx.lineWidth = 5 * p;
          strokePath(b.main);
          ctx.strokeStyle = `rgba(255,255,255,${a})`;
          ctx.lineWidth = 1.8 * p;
          strokePath(b.main);
          for (const br of b.branches) {
            ctx.strokeStyle = `rgba(150,200,255,${a * 0.35})`;
            ctx.lineWidth = 4 * p;
            strokePath(br);
            ctx.strokeStyle = `rgba(230,240,255,${a * 0.7})`;
            ctx.lineWidth = 1 * p;
            strokePath(br);
          }
          b.life -= p < 0.5 ? 0.05 : 0.055;
          if (b.life <= 0) bolts.splice(i, 1);
        }
      }

      /* =========================================================
   OCEAN
   ========================================================= */
      function waveH(x, z, t, chop) {
        return (
          Math.sin(x * 2.1 + z * 1.7 - t * 1.15) * 0.5 +
          Math.sin(-x * 1.3 + z * 2.8 - t * 1.75) * 0.3 +
          Math.sin(x * 3.9 + z * 1.05 + t * 1.25) * 0.2 +
          chop * Math.sin(x * 6.3 - z * 4.1 - t * 3.2) * 0.35
        );
      }

      function updateOcean(introF) {
        const amp = 0.03 + storm * 0.11;
        const chop = storm;
        const W11 = W * 1.1,
          W05 = W * 0.05,
          cx = W / 2;

        // collect forces from hands
        const wakes = [],
          presses = [];
        for (const h of activeHands()) {
          const sp = Math.min(h.speed, 40);
          if (sp > 0.8) {
            const r = 120 + sp * 4;
            wakes.push({
              x: h.x,
              y: h.y,
              vx: h.vx,
              vy: h.vy,
              r,
              r2: r * r,
              push: sp * 0.07,
              lift: sp * 0.05,
            });
            if (sp > 9 && h.y > HORIZON && spray.length < 1600) {
              const n = Math.floor((sp - 9) * 0.45);
              for (let k = 0; k < n; k++) {
                spray.push({
                  x: h.x + (Math.random() - 0.5) * r * 0.8,
                  y: h.y + (Math.random() - 0.5) * 30,
                  vx: h.vx * 0.35 + (Math.random() - 0.5) * 3,
                  vy: -(3 + Math.random() * 8) * (sp / 40) - 1,
                  life: 1,
                  decay: 0.015 + Math.random() * 0.02,
                });
              }
            }
          }
          const pressTarget = h.open && h.speed < 5 && h.y > HORIZON ? 1 : 0;
          h.press += (pressTarget - h.press) * 0.08;
          if (h.press > 0.02) {
            const R = Math.max(110, h.size * 2.4);
            presses.push({
              x: h.x,
              y: h.y,
              R,
              R2: R * R,
              ring2: (R * 1.8) ** 2,
              s: h.press,
            });
          }
        }

        // two hands -> whirlpool
        const two = hands[0].active && hands[1].active;
        const hd = two
          ? Math.hypot(hands[1].x - hands[0].x, hands[1].y - hands[0].y)
          : 0;
        vortexS += ((two && hd > 140 ? 1 : 0) - vortexS) * 0.05;
        if (two) {
          vortex.x = (hands[0].x + hands[1].x) / 2;
          vortex.y = (hands[0].y + hands[1].y) / 2;
          vortex.r = hd * 0.55;
        }
        const useV = vortexS > 0.02;
        const vR = vortex.r,
          vR2 = vR * vR;

        for (let i = 0; i < N; i++) {
          const z = pz[i],
            s = H / z;
          const bx = pu[i] * W11 - W05;
          const h = waveH((bx - cx) / s, z, t, chop);
          const hy = HORIZON + CAM * s - h * amp * s;
          const x = bx + ox[i],
            y = hy + oy[i];
          let fx = 0,
            fy = 0,
            k = SPRING;

          for (let w = 0; w < wakes.length; w++) {
            const q = wakes[w],
              dx = x - q.x,
              dy = y - q.y,
              d2 = dx * dx + dy * dy;
            if (d2 < q.r2) {
              const d = Math.sqrt(d2) + 0.001,
                f = 1 - d / q.r,
                f2 = f * f;
              fx += (dx / d) * f2 * q.push + q.vx * f2 * 0.06;
              fy +=
                (dy / d) * f2 * q.push * 0.6 + q.vy * f2 * 0.04 - f2 * q.lift;
            }
          }
          for (let p = 0; p < presses.length; p++) {
            const q = presses[p],
              dx = x - q.x,
              dy = y - q.y,
              d2 = dx * dx + dy * dy;
            if (d2 < q.R2) {
              const f = 1 - Math.sqrt(d2) / q.R;
              fy += q.s * f * f * 2.2;
            } else if (d2 < q.ring2) {
              const d = Math.sqrt(d2),
                f = 1 - Math.abs(d - q.R * 1.4) / (q.R * 0.4);
              if (f > 0) fy -= q.s * f * 1.1;
            }
          }
          if (useV) {
            const dx = x - vortex.x,
              dy = y - vortex.y,
              d2 = dx * dx + dy * dy;
            if (d2 < vR2) {
              const d = Math.sqrt(d2) + 0.001,
                f = 1 - d / vR,
                vs = vortexS;
              fx += (-dy / d) * f * vs * 2.4 - (dx / d) * f * vs * 0.3;
              fy +=
                (dx / d) * f * vs * 1.5 -
                (dy / d) * f * vs * 0.3 +
                f * f * vs * 1.2;
              k *= 1 - 0.85 * f * vs;
            }
          }
          for (let sI = 0; sI < shocks.length; sI++) {
            const q = shocks[sI],
              dx = x - q.x,
              dy = y - q.y;
            const d = Math.sqrt(dx * dx + dy * dy) + 0.001,
              diff = Math.abs(d - q.r);
            if (diff < 70) {
              const f = q.str * (1 - diff / 70);
              fx += (dx / d) * f;
              fy += (dy / d) * f * 0.6 - f * 0.4;
            }
          }

          let nvx = (vx[i] + fx - ox[i] * k) * DAMP;
          let nvy = (vy[i] + fy - oy[i] * k) * DAMP;
          nvx = clamp(nvx, -60, 60);
          nvy = clamp(nvy, -60, 60);
          vx[i] = nvx;
          vy[i] = nvy;
          ox[i] += nvx;
          oy[i] += nvy;
          px[i] = bx + ox[i];
          py[i] = hy + oy[i];
          psz[i] = 0.55 + 2.2 / z;

          // brightness: wave crests + how hard the water is moving + lightning
          const crest = clamp((h + 1) * 0.5, 0, 1);
          const depthB = 1 - prow[i] * 0.55;
          const energy = (Math.abs(nvx) + Math.abs(nvy)) * 0.05;
          let b =
            crest * crest * crest * (0.45 + storm * 0.35) * depthB +
            energy +
            flash * 0.7 * depthB +
            skyFlash * 0.18 * prow[i] +
            0.05;
          b *= introF;
          plv[i] = b >= 1 ? 7 : (b * 8) | 0;

          // storm crests throw spray on their own
          if (
            storm > 0.4 &&
            crest > 0.97 &&
            prow[i] < 0.35 &&
            spray.length < 1600 &&
            Math.random() < storm * 0.004
          ) {
            spray.push({
              x: px[i],
              y: py[i],
              vx: (Math.random() - 0.5) * 2 - 1,
              vy: -(2 + Math.random() * 5 * storm),
              life: 0.8,
              decay: 0.02 + Math.random() * 0.02,
            });
          }
        }

        for (let sI = shocks.length - 1; sI >= 0; sI--) {
          const q = shocks[sI];
          q.r += 22;
          q.str *= 0.95;
          if (q.r > Math.max(W, H) * 1.3 || q.str < 0.2) shocks.splice(sI, 1);
        }
      }

      function drawOcean() {
        for (let L = 0; L < 8; L++) {
          ctx.fillStyle = COLORS[L];
          for (let i = 0; i < N; i++) {
            if (plv[i] === L) ctx.fillRect(px[i], py[i], psz[i], psz[i]);
          }
        }
      }

      /* =========================================================
   SPRAY, RAIN, SKY, HAND GLOW
   ========================================================= */
      function updateDrawSpray() {
        ctx.fillStyle = "#cfe8ff";
        for (let i = spray.length - 1; i >= 0; i--) {
          const s = spray[i];
          s.vy += 0.32;
          s.vx *= 0.99;
          s.x += s.vx;
          s.y += s.vy;
          s.life -= s.decay;
          if (s.life <= 0 || s.y > H + 10) {
            spray[i] = spray[spray.length - 1];
            spray.pop();
            continue;
          }
          ctx.globalAlpha = s.life * 0.85;
          ctx.fillRect(s.x, s.y, 1.7, 1.7);
        }
        ctx.globalAlpha = 1;
      }

      function drawRain() {
        const count = Math.floor(90 + storm * 240);
        ctx.strokeStyle = `rgba(130,170,215,${0.1 + storm * 0.18 + flash * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const d = rain[i];
          d.x -= d.s * 0.32 * (1 + storm);
          d.y += d.s * (1 + storm * 0.6);
          if (d.y > H || d.x < -30) {
            d.y = -20 - Math.random() * 100;
            d.x = Math.random() * W * 1.3;
          }
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.l * 0.32, d.y - d.l);
        }
        ctx.stroke();
      }

      function drawSky() {
        if (skyFlash < 0.02) return;
        const g = ctx.createLinearGradient(0, 0, 0, HORIZON * 1.15);
        g.addColorStop(0, `rgba(110,150,215,${skyFlash * 0.22})`);
        g.addColorStop(1, "rgba(110,150,215,0)");
        ctx.fillStyle = g;
        ctx.fillRect(-20, -20, W + 40, HORIZON * 1.15 + 20);
      }

      function drawHandGlow() {
        ctx.globalCompositeOperation = "lighter";
        for (const h of activeHands()) {
          const r = Math.max(60, h.size * 1.6);
          const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r);
          if (h.fist) {
            g.addColorStop(0, "rgba(220,235,255,0.14)");
            g.addColorStop(1, "rgba(220,235,255,0)");
          } else {
            g.addColorStop(0, "rgba(70,140,255,0.08)");
            g.addColorStop(1, "rgba(70,140,255,0)");
          }
          ctx.fillStyle = g;
          ctx.fillRect(h.x - r, h.y - r, r * 2, r * 2);
        }
        ctx.globalCompositeOperation = "source-over";
      }

      function drawHints(now) {
        if (!entered) return;
        const e = (now - enteredAt) / 1000;
        if (e < 2.5 || e > 12) return;
        const a = Math.min(1, (e - 2.5) / 1.5) * Math.min(1, (12 - e) / 2);
        ctx.textAlign = "center";
        ctx.font = "300 13px 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = `rgba(110,150,200,${a * 0.18})`;
        ctx.fillText(
          "M O V E   Y O U R   H A N D   T H R O U G H   T H E   S E A",
          W / 2,
          H * 0.17,
        );
        ctx.fillText(
          "C L O S E   Y O U R   F I S T   T O   S T R I K E",
          W / 2,
          H * 0.17 + 26,
        );
      }

      /* =========================================================
   MAIN LOOP
   ========================================================= */
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        detect(now);
        updateMouse(now);
        distantLightning(now);

        // storm level follows how wild your hands are
        let energy = 0;
        for (const h of activeHands()) energy += h.speed;
        const target = Math.min(1, energy / 28);
        storm += (target - storm) * (target > storm ? 0.06 : 0.008);
        t += dt * (1 + storm * 0.9);

        const introF =
          clamp((now - startTime) / 4500, 0, 1) * (entered ? 1 : 0.45);

        // dark trail instead of a full clear = motion blur
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = "rgba(0,2,7,0.42)";
        ctx.fillRect(0, 0, W, H);

        const sh = shake * shake * 14;
        ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

        drawSky();
        updateOcean(introF);
        drawOcean();
        updateDrawSpray();
        drawRain();
        drawBolts();
        drawHandGlow();
        drawHints(now);

        if (flash > 0.01) {
          ctx.fillStyle = `rgba(200,225,255,${flash * 0.35})`;
          ctx.fillRect(-30, -30, W + 60, H + 60);
        }

        flash *= 0.86;
        skyFlash *= 0.9;
        shake *= 0.88;

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      /* =========================================================
   START + KEYS
   ========================================================= */
      document.getElementById("enter").addEventListener("click", () => {
        entered = true;
        enteredAt = performance.now();
        startTime = performance.now() - 1500;
        overlay.classList.add("gone");
        document.body.classList.add("live");
        initHands();
      });

      addEventListener("keydown", (e) => {
        if ((e.key === "c" || e.key === "C") && camReady)
          camBox.classList.toggle("show");
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement)
            document.documentElement.requestFullscreen?.();
          else document.exitFullscreen?.();
        }
      });
    </script>
  </body>
</html>
