<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Island Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap"
    />
    <style>
      /* Layout: full-screen canvas, one frosted control dock that hides for recording */
      :root {
        --bg: #1c0306;
        --fg: #fff;
        --muted: rgba(255, 255, 255, 0.72);
        --glass: rgba(255, 255, 255, 0.12);
        --edge: rgba(255, 255, 255, 0.32);
        --shadow: rgba(4, 8, 20, 0.35);
        --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--body);
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
      }
      .glass {
        background: var(--glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--edge);
        box-shadow:
          0 12px 40px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .dock {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        width: min(
          700px,
          calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px)))
        );
        border-radius: 24px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .dock.off {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 24px);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .status {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .status b {
        color: var(--fg);
      }
      button,
      .filebtn {
        position: relative;
        font: 700 14px/1 var(--body);
        color: var(--fg);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 999px;
        padding: 11px 16px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      button:hover,
      .filebtn:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.5);
      }
      button:focus-visible,
      .filebtn:focus-within {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .primary {
        background: rgba(255, 255, 255, 0.88);
        color: #111;
        border-color: #fff;
      }
      .filebtn input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .swatches {
        display: flex;
        gap: 8px;
      }
      .sw {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .sw[aria-pressed="true"] {
        border-color: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25);
      }
      .sens {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 200px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sens input {
        flex: 1;
        min-width: 0;
        accent-color: #fff;
      }
      .hint {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        white-space: nowrap;
      }
      .hint.on {
        opacity: 1;
      }
      @media (max-width: 480px) {
        button,
        .filebtn {
          padding: 10px 12px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Music visualizer"></canvas>
    <div class="hint glass" id="hint">
      Tap anywhere to bring the controls back
    </div>

    <div class="dock glass" id="dock">
      <div class="row">
        <button class="primary" id="demoBtn" type="button">
          ▶ Play demo beat
        </button>
        <button id="tabBtn" type="button">⧉ Listen to a tab</button>
        <button id="micBtn" type="button">● Use mic</button>
        <label class="filebtn"
          >♫ Load a song<input id="fileIn" type="file" accept="audio/*"
        /></label>
        <button id="pauseBtn" type="button" hidden>❚❚ Pause</button>
        <label class="filebtn" id="imgBtn" hidden
          >▣ Change logo<input id="imgIn" type="file" accept="image/*"
        /></label>
      </div>
      <div class="row">
        <div
          class="swatches"
          id="swatches"
          role="group"
          aria-label="Theme"
        ></div>
        <div class="status" id="status">
          Idle · <b>press play</b> or pick a source
        </div>
      </div>
      <div class="row">
        <label class="sens" for="sensIn"
          >Bass sensitivity
          <input id="sensIn" type="range" min="0" max="100" value="50"
        /></label>
        <button id="fsBtn" type="button">⤢ Fullscreen</button>
        <button id="hideBtn" type="button">Hide controls</button>
      </div>
    </div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const statusEl = $("status"),
          pauseBtn = $("pauseBtn");

        /* ================= THEMES ================= */
        const THEMES = {
          Tonga: {
            kind: "tonga",
            bg: "#1c0306",
            blobs: ["#c10000", "#ff2b3a", "#ffd6da", "#7a0010"],
            swatch: "linear-gradient(#fff,#fff) 0 0/55% 50% no-repeat,#c10000",
          },
          Studio: {
            kind: "studio",
            bg: "#060607",
            swatch:
              "radial-gradient(circle,#c9ccd4 0 16%,#141418 18% 52%,#4a4a52 54% 66%,#0c0c0e 68%)",
          },
          Lagoon: {
            kind: "glass",
            bg: "#0b1a33",
            blobs: ["#1fe5c4", "#3a7bff", "#8a5cff", "#2cc3ff"],
          },
          Sunset: {
            kind: "glass",
            bg: "#2a0f2a",
            blobs: ["#ff8a3d", "#ff3f8e", "#a24bff", "#ffc24a"],
          },
          Tapa: {
            kind: "glass",
            bg: "#24150c",
            blobs: ["#e7a256", "#c2502a", "#f3d7a6", "#8a3b1f"],
          },
          Reef: {
            kind: "glass",
            bg: "#120c2e",
            blobs: ["#ff6f8a", "#38e1d6", "#9d7bff", "#ffb36b"],
          },
        };
        const hex = (h) =>
          [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
        const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
        let theme,
          COLS = [],
          bgDirty = true;
        const shards = [],
          rings = [],
          ripples = [],
          coneDust = [];
        function setTheme(name) {
          theme = THEMES[name];
          COLS = (theme.blobs || []).map(hex);
          document.documentElement.style.setProperty("--bg", theme.bg);
          $("imgBtn").hidden = theme.kind !== "tonga";
          shards.length = rings.length = ripples.length = coneDust.length = 0;
          bgDirty = true;
        }
        const sw = $("swatches");
        Object.entries(THEMES).forEach(([name, t], i) => {
          const b = document.createElement("button");
          b.className = "sw";
          b.type = "button";
          b.title = name;
          b.setAttribute("aria-label", name + " theme");
          b.style.background =
            t.swatch ||
            `linear-gradient(135deg,${t.blobs[0]},${t.blobs[1]},${t.blobs[2]})`;
          b.setAttribute("aria-pressed", i === 0);
          b.onclick = () => {
            setTheme(name);
            sw.querySelectorAll(".sw").forEach((x) =>
              x.setAttribute("aria-pressed", x === b),
            );
          };
          sw.appendChild(b);
        });

        /* ================= AUDIO ================= */
        let ac, analyser, master, noiseBuf;
        let freq = new Uint8Array(512),
          wave = new Uint8Array(1024);
        let mode = "idle",
          audioEl = null,
          demoTimer = null,
          nextTime = 0,
          step = 0;

        function ensureAudio() {
          if (ac) return;
          ac = new (window.AudioContext || window.webkitAudioContext)();
          analyser = ac.createAnalyser();
          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.45;
          master = ac.createGain();
          master.gain.value = 0.9;
          master.connect(ac.destination);
          master.connect(analyser); // shared tab / mic go to the analyser only (no echo)
          freq = new Uint8Array(analyser.frequencyBinCount);
          wave = new Uint8Array(analyser.fftSize);
          noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
        function kick(t) {
          const o = ac.createOscillator(),
            gn = ac.createGain();
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
          gn.gain.setValueAtTime(1, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          o.connect(gn).connect(master);
          o.start(t);
          o.stop(t + 0.5);
        }
        function noiseHit(t, type, f, vol, dur) {
          const s = ac.createBufferSource(),
            fl = ac.createBiquadFilter(),
            gn = ac.createGain();
          s.buffer = noiseBuf;
          fl.type = type;
          fl.frequency.value = f;
          gn.gain.setValueAtTime(vol, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
          s.connect(fl).connect(gn).connect(master);
          s.start(t);
          s.stop(t + dur + 0.05);
        }
        function tone(t, f, type, vol, dur, cut) {
          const o = ac.createOscillator(),
            fl = ac.createBiquadFilter(),
            gn = ac.createGain();
          o.type = type;
          o.frequency.value = f;
          fl.type = "lowpass";
          fl.frequency.value = cut;
          fl.Q.value = 3;
          gn.gain.setValueAtTime(0, t);
          gn.gain.linearRampToValueAtTime(vol, t + 0.01);
          gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(fl).connect(gn).connect(master);
          o.start(t);
          o.stop(t + dur + 0.05);
        }
        function riser(t, dur) {
          const s = ac.createBufferSource(),
            fl = ac.createBiquadFilter(),
            gn = ac.createGain();
          s.buffer = noiseBuf;
          s.loop = true;
          fl.type = "bandpass";
          fl.Q.value = 2;
          fl.frequency.setValueAtTime(300, t);
          fl.frequency.exponentialRampToValueAtTime(7000, t + dur);
          gn.gain.setValueAtTime(0.001, t);
          gn.gain.exponentialRampToValueAtTime(0.35, t + dur);
          s.connect(fl).connect(gn).connect(master);
          s.start(t);
          s.stop(t + dur);
        }
        const ROOTS = [45, 41, 48, 43],
          CHORDS = [
            [57, 60, 64],
            [53, 57, 60],
            [55, 60, 64],
            [55, 59, 62],
          ];
        const BASS = { 0: 0, 3: 0, 6: 7, 8: 12, 10: 7, 14: 3 },
          BPM = 96;
        // 16-bar demo song: groove -> breakdown -> build-up -> DROP
        function playStep(s, t) {
          const B = Math.floor(s / 16) % 16,
            bar = B % 4,
            st = s % 16,
            root = ROOTS[bar];
          const sec =
            B < 6 ? "groove" : B < 8 ? "break" : B < 10 ? "build" : "drop";
          const skank = st === 2 || st === 6 || st === 10 || st === 14;
          if (sec === "break") {
            if (skank)
              CHORDS[bar].forEach((n) =>
                tone(t, mtof(n), "square", 0.05, 0.22, 1800),
              );
            if (st % 4 === 2) noiseHit(t, "highpass", 7500, 0.05, 0.05);
            return;
          }
          if (sec === "build") {
            if (B === 8 && st === 0) riser(t, (60 / BPM) * 8);
            if (st % 4 === 0) noiseHit(t, "bandpass", 420, 0.45, 0.08);
            const every = B === 8 ? 4 : st < 8 ? 2 : 1;
            if (st % every === 0)
              noiseHit(
                t,
                "bandpass",
                1900,
                0.2 + (((B - 8) * 16 + st) / 32) * 0.4,
                0.12,
              );
            if (st % 2 === 0) noiseHit(t, "highpass", 7500, 0.1, 0.05);
            if (skank)
              CHORDS[bar].forEach((n) =>
                tone(t, mtof(n), "square", 0.04, 0.1, 2200),
              );
            return;
          }
          if (sec === "drop" && B === 10 && st === 0)
            noiseHit(t, "highpass", 4000, 0.55, 1.8);
          if (st === 0 || st === 6 || st === 8 || st === 11) kick(t);
          if (st === 4 || st === 12) {
            noiseHit(t, "bandpass", 1900, 0.55, 0.18);
            tone(t, 190, "triangle", 0.25, 0.08, 2000);
          }
          if (st % 2 === 0)
            noiseHit(t, "highpass", 7500, st % 4 === 2 ? 0.16 : 0.07, 0.05);
          if (st in BASS)
            tone(
              t,
              mtof(root + BASS[st]),
              "sawtooth",
              sec === "drop" ? 0.38 : 0.32,
              0.28,
              sec === "drop" ? 700 : 520,
            );
          if (skank)
            CHORDS[bar].forEach((n) =>
              tone(t, mtof(n), "square", 0.045, 0.12, 2600),
            );
        }
        function scheduler() {
          const spb = 60 / BPM / 4;
          while (nextTime < ac.currentTime + 0.12) {
            playStep(step, nextTime);
            nextTime += spb;
            step = (step + 1) % 256;
          }
        }
        function stopDemo() {
          if (demoTimer) {
            clearInterval(demoTimer);
            demoTimer = null;
          }
        }
        function startDemo() {
          ensureAudio();
          ac.resume();
          if (audioEl) audioEl.pause();
          stopStream();
          stopDemo();
          nextTime = ac.currentTime + 0.05;
          step = 0;
          demoTimer = setInterval(scheduler, 25);
          mode = "demo";
          statusEl.innerHTML = `Playing · <b>demo beat</b> · drop at 0:25`;
          pauseBtn.hidden = false;
          pauseBtn.textContent = "❚❚ Pause";
        }
        $("demoBtn").onclick = startDemo;

        // live sources: a shared browser tab (YouTube etc.) or the mic
        let stream = null,
          streamSrc = null;
        function stopStream() {
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
          }
          if (streamSrc) {
            streamSrc.disconnect();
            streamSrc = null;
          }
        }
        async function grabTab(audio) {
          // ask for the smallest, slowest video possible: we only need the sound, and video capture costs a lot of power
          const opts = {
            video: {
              frameRate: { max: 1 },
              width: { max: 160 },
              height: { max: 120 },
            },
            audio,
            selfBrowserSurface: "exclude",
            surfaceSwitching: "exclude",
            systemAudio: "exclude",
            preferCurrentTab: false,
          };
          try {
            return await navigator.mediaDevices.getDisplayMedia(opts);
          } catch (e) {
            if (e && e.name === "TypeError")
              return navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio,
              });
            throw e;
          }
        }
        async function useStream(kind) {
          ensureAudio();
          ac.resume();
          const clean = {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          };
          try {
            const s =
              kind === "tab"
                ? await grabTab(clean)
                : await navigator.mediaDevices.getUserMedia({ audio: clean });
            if (!s.getAudioTracks().length) {
              s.getTracks().forEach((t) => t.stop());
              statusEl.textContent =
                "No sound came through. Pick the YouTube tab and switch on “Share tab audio”.";
              return;
            }
            s.getVideoTracks().forEach((v) => {
              try {
                v.applyConstraints({ frameRate: 1, width: 160, height: 120 });
              } catch (e) {}
            });
            stopDemo();
            if (audioEl) audioEl.pause();
            stopStream();
            stream = s;
            streamSrc = ac.createMediaStreamSource(
              new MediaStream(s.getAudioTracks()),
            );
            streamSrc.connect(analyser);
            mode = "stream";
            pauseBtn.hidden = true;
            statusEl.innerHTML =
              kind === "tab"
                ? "Listening · <b>shared tab</b>"
                : "Listening · <b>microphone</b>";
            s.getAudioTracks()[0].onended = () => {
              stopStream();
              mode = "idle";
              statusEl.innerHTML = "Stopped · <b>pick a source</b>";
            };
          } catch (err) {
            statusEl.textContent =
              kind === "tab"
                ? "Tab sharing was cancelled or isn't supported. Use Chrome or Edge on a laptop."
                : "Mic access was blocked. Allow the mic in the address bar and try again.";
          }
        }
        $("tabBtn").onclick = () => useStream("tab");
        $("micBtn").onclick = () => useStream("mic");
        $("fileIn").onchange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          ensureAudio();
          ac.resume();
          stopDemo();
          stopStream();
          if (!audioEl) {
            audioEl = new Audio();
            audioEl.loop = true;
            ac.createMediaElementSource(audioEl).connect(master);
          }
          if (audioEl.src) URL.revokeObjectURL(audioEl.src);
          audioEl.src = URL.createObjectURL(f);
          audioEl
            .play()
            .then(() => {
              mode = "file";
              pauseBtn.hidden = false;
              pauseBtn.textContent = "❚❚ Pause";
              statusEl.innerHTML = "Playing · <b></b>";
              statusEl.querySelector("b").textContent = f.name.replace(
                /\.[^.]+$/,
                "",
              );
            })
            .catch(() => {
              statusEl.textContent =
                "Couldn't play that file. Try an mp3 or m4a.";
            });
        };
        pauseBtn.onclick = () => {
          if (mode === "demo") {
            stopDemo();
            mode = "paused-demo";
            pauseBtn.textContent = "▶ Resume";
            statusEl.innerHTML = "Paused · <b>demo beat</b>";
          } else if (mode === "paused-demo") startDemo();
          else if (mode === "file") {
            audioEl.pause();
            mode = "paused-file";
            pauseBtn.textContent = "▶ Resume";
          } else if (mode === "paused-file") {
            ac.resume();
            audioEl.play();
            mode = "file";
            pauseBtn.textContent = "❚❚ Pause";
          }
        };

        /* ================= UI ================= */
        const dock = $("dock"),
          hint = $("hint");
        let hintTimer;
        function hideDock() {
          dock.classList.add("off");
          hint.classList.add("on");
          clearTimeout(hintTimer);
          hintTimer = setTimeout(() => hint.classList.remove("on"), 1800);
        }
        function showDock() {
          dock.classList.remove("off");
          hint.classList.remove("on");
        }
        $("hideBtn").onclick = hideDock;
        $("fsBtn").onclick = () => {
          if (document.fullscreenElement) document.exitFullscreen?.();
          else document.documentElement.requestFullscreen?.().catch(() => {});
        };
        let sens = 0.5;
        $("sensIn").oninput = (e) => {
          sens = e.target.value / 100;
        };
        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT") return;
          if (e.key === "h" || e.key === "H")
            dock.classList.contains("off") ? showDock() : hideDock();
          if (e.key === " ") {
            e.preventDefault();
            if (mode === "idle") startDemo();
            else if (!pauseBtn.hidden) pauseBtn.click();
          }
        });

        /* ================= CANVASES (everything heavy is pre-drawn once) ================= */
        const cv = $("stage"),
          g = cv.getContext("2d");
        const bgC = document.createElement("canvas"),
          bg = bgC.getContext("2d"); // background at half size
        const tinyC = document.createElement("canvas"),
          tiny = tinyC.getContext("2d"); // tiny copy = cheap blur for the glass
        const vigC = document.createElement("canvas"),
          raysC = document.createElement("canvas"),
          shadowC = document.createElement("canvas");
        const beamC = document.createElement("canvas"),
          beamX = beamC.getContext("2d");
        let W = 0,
          H = 0,
          DPR = 1,
          BW = 1,
          BH = 1,
          S = 1;

        // Tonga flag (square, made for the circle)
        const flagC = document.createElement("canvas");
        flagC.width = flagC.height = 400;
        {
          const f = flagC.getContext("2d");
          f.fillStyle = "#c10000";
          f.fillRect(0, 0, 400, 400);
          f.fillStyle = "#fff";
          f.fillRect(0, 0, 194, 194);
          f.fillStyle = "#c10000";
          f.fillRect(138 - 46, 138 - 15, 92, 30);
          f.fillRect(138 - 15, 138 - 46, 30, 92);
        }

        // smoke texture for the Studio theme
        function makeSmoke(n, seed) {
          const c = document.createElement("canvas");
          c.width = c.height = n;
          const x = c.getContext("2d"),
            img = x.createImageData(n, n);
          let s = seed;
          const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
          const G = 32,
            grid = [];
          for (let i = 0; i < G * G; i++) grid.push(rnd());
          const sm = (q) => q * q * (3 - 2 * q);
          const vn = (px, py) => {
            const xi = Math.floor(px),
              yi = Math.floor(py),
              xf = sm(px - xi),
              yf = sm(py - yi);
            const a = grid[(yi % G) * G + (xi % G)],
              b = grid[(yi % G) * G + ((xi + 1) % G)],
              c2 = grid[((yi + 1) % G) * G + (xi % G)],
              d = grid[((yi + 1) % G) * G + ((xi + 1) % G)];
            return (
              a + (b - a) * xf + (c2 - a) * yf + (a - b - c2 + d) * xf * yf
            );
          };
          for (let y = 0; y < n; y++)
            for (let X = 0; X < n; X++) {
              let v = 0,

        $("imgIn").onchange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const im = new Image();
          im.onload = () => {
            logoImg = im;
            makeLogoBlur();
            bgDirty = true;
          };
          im.src = URL.createObjectURL(f);
        };
        function makeLogoBlur() {
          if (!logoImg.complete || !logoImg.naturalWidth) return;
          logoBlurC.width = BW;
          logoBlurC.height = BH;
          const x = logoBlurC.getContext("2d");
          const fit =
              (Math.min(BW, BH) * 1.05) /
              Math.max(logoImg.width, logoImg.height),
            iw = logoImg.width * fit,
            ih = logoImg.height * fit;
          x.filter = "blur(6px)";
          x.globalAlpha = 0.6;
          x.drawImage(logoImg, BW / 2 - iw / 2, BH * 0.45 - ih / 2, iw, ih);
        }

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 1.5);
          W = window.innerWidth;
          H = window.innerHeight;
          S = Math.min(W, H);
          cv.width = Math.round(W * DPR);
          cv.height = Math.round(H * DPR);
          BW = Math.max(1, Math.round(W / 2));
          BH = Math.max(1, Math.round(H / 2));
          bgC.width = beamC.width = vigC.width = BW;
          bgC.height = beamC.height = vigC.height = BH;
          tinyC.width = Math.max(1, Math.round(W / 24));
          tinyC.height = Math.max(1, Math.round(H / 24));
          // vignette
          const v = vigC.getContext("2d"),
            vg = v.createRadialGradient(
              BW / 2,
              BH * 0.45,
              Math.min(BW, BH) * 0.3,
              BW / 2,
              BH * 0.45,
              Math.max(BW, BH) * 0.75,
            );
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, "rgba(0,0,0,.45)");
          v.fillStyle = vg;
          v.fillRect(0, 0, BW, BH);
          // light rays sprite (Tonga)
          const rs = Math.round(S * 1.1);
          raysC.width = raysC.height = rs;
          const r = raysC.getContext("2d"),
            rc = rs / 2;
          for (let i = 0; i < 18; i++) {
            const a = (i / 18) * Math.PI * 2,
              w = (Math.PI / 18) * 0.45;
            const gr = r.createRadialGradient(rc, rc, S * 0.15, rc, rc, rc);
            gr.addColorStop(0, "rgba(255,205,195,.22)");
            gr.addColorStop(1, "rgba(255,205,195,0)");
            r.fillStyle = gr;
            r.beginPath();
            r.moveTo(rc, rc);
            r.arc(rc, rc, rc, a - w, a + w);
            r.closePath();
            r.fill();
          }
          // soft drop shadow sprite for the disc / speaker
          const sh = Math.round(S * 0.9);
          shadowC.width = shadowC.height = sh;
          const s2 = shadowC.getContext("2d"),
            sc = sh / 2;
          const sg = s2.createRadialGradient(sc, sc, 0, sc, sc, sc);
          sg.addColorStop(0, "rgba(0,0,0,.55)");
          sg.addColorStop(0.55, "rgba(0,0,0,.3)");
          sg.addColorStop(1, "rgba(0,0,0,0)");
          s2.fillStyle = sg;
          s2.fillRect(0, 0, sh, sh);
          makeLogoBlur();
          bgDirty = true;
        }
        addEventListener("resize", resize);
        resize();
        cv.addEventListener("click", () => {
          if (dock.classList.contains("off")) showDock();
        });
        setTheme("Tonga");

        /* ================= BACKGROUNDS (drawn at half size, every other frame) ================= */
        const BLOBS = [
          { x: 0.3, y: 0.32, r: 0.42, sp: 0.13, ph: 0, c: 0 },
          { x: 0.72, y: 0.36, r: 0.38, sp: 0.1, ph: 2, c: 1 },
          { x: 0.4, y: 0.72, r: 0.36, sp: 0.16, ph: 4, c: 2 },
          { x: 0.7, y: 0.7, r: 0.34, sp: 0.12, ph: 1.3, c: 3 },
        ];
        function drawBlobs(t, swell, alpha) {
          const s = Math.min(BW, BH);
          bg.globalCompositeOperation = "screen";
          bg.globalAlpha = alpha;
          for (const b of BLOBS) {
            const x = BW * (b.x + 0.16 * Math.sin(t * b.sp + b.ph)),
              y = BH * (b.y + 0.13 * Math.cos(t * b.sp * 0.8 + b.ph)),
              r = s * b.r * (1 + swell * 0.4);
            const gr = bg.createRadialGradient(x, y, 0, x, y, r),
              col = COLS[b.c];
            gr.addColorStop(0, rgba(col, 0.85));
            gr.addColorStop(0.55, rgba(col, 0.35));
            gr.addColorStop(1, rgba(col, 0));
            bg.fillStyle = gr;
            bg.beginPath();
            bg.arc(x, y, r, 0, Math.PI * 2);
            bg.fill();
          }
          bg.globalCompositeOperation = "source-over";
          bg.globalAlpha = 1;
        }
        function drawSmoke(x2, t, sz) {
          for (const [img, sp, dir] of [
            [smokeA, 0.012, 1],
            [smokeB, 0.008, -1],
          ]) {
            const ox = ((t * sp * dir) % 1) * sz;
            for (let k = -1; k <= 1; k++)
              x2.drawImage(img, ox + k * sz - sz * 0.1, -sz * 0.1, sz, sz);
          }
        }
        function drawBackground(t, hit, flash) {
          bg.fillStyle = theme.bg;
          bg.fillRect(0, 0, BW, BH);
          if (theme.kind === "glass") {
            drawBlobs(t, hit, 1);
            return;
          }
          if (theme.kind === "tonga") {
            if (logoBlurC.width > 1) {
              const z = 1 + hit * 0.04;
              bg.drawImage(
                logoBlurC,
                (BW * (1 - z)) / 2,
                BH * 0.45 * (1 - z),
                BW * z,
                BH * z,
              );
            }
            bg.fillStyle = "rgba(150,0,12,.32)";
            bg.fillRect(0, 0, BW, BH);
            drawBlobs(t, hit, 0.7);
            return;
          }
          // studio: haze + smoke + two spotlights
          const hz = bg.createRadialGradient(
            BW / 2,
            BH * 0.45,
            0,
            BW / 2,
            BH * 0.45,
            Math.max(BW, BH) * 0.7,
          );
          hz.addColorStop(0, "#28262f");
          hz.addColorStop(1, "#060607");
          bg.fillStyle = hz;
          bg.fillRect(0, 0, BW, BH);
          const sz = Math.max(BW, BH) * 1.2;
          bg.globalAlpha = 0.16;
          drawSmoke(bg, t, sz);
          bg.globalAlpha = 1;
          beamX.clearRect(0, 0, BW, BH);
          const white = Math.min(1, flash);
          const spots = [
            {
              x: -BW * 0.05,
              col: [255, 186, 110],
              a: 0.55 + Math.sin(t * 0.4) * 0.2,
            },
            {
              x: BW * 1.05,
              col: [120, 170, 255],
              a: Math.PI - 0.55 - Math.sin(t * 0.33 + 1) * 0.2,
            },
          ];
          for (const sp of spots) {
            const col = sp.col.map((v) => Math.round(v + (255 - v) * white)),
              len = Math.hypot(BW, BH) * 1.1,
              spread = 0.15 + hit * 0.04;
            beamX.save();
            beamX.beginPath();
            beamX.moveTo(sp.x, -10);
            beamX.lineTo(
              sp.x + Math.cos(sp.a - spread) * len,
              -10 + Math.sin(sp.a - spread) * len,
            );
            beamX.lineTo(
              sp.x + Math.cos(sp.a + spread) * len,
              -10 + Math.sin(sp.a + spread) * len,
            );
            beamX.closePath();
            beamX.clip();
            const lg = beamX.createRadialGradient(
              sp.x,
              -10,
              0,
              sp.x,
              -10,
              len * 0.95,
            );
            lg.addColorStop(0, `rgba(${col},${0.75 + hit * 0.25})`);
            lg.addColorStop(1, `rgba(${col},0)`);
            beamX.fillStyle = lg;
            beamX.fillRect(0, 0, BW, BH);
            beamX.globalCompositeOperation = "destination-in";
            drawSmoke(beamX, t, sz);
            beamX.globalCompositeOperation = "lighter";
            const lg2 = beamX.createRadialGradient(
              sp.x,
              -10,
              0,
              sp.x,
              -10,
              len * 0.8,
            );
            lg2.addColorStop(
              0,
              `rgba(${col},${0.06 + hit * 0.12 + flash * 0.2})`,
            );
            lg2.addColorStop(1, `rgba(${col},0)`);
            beamX.fillStyle = lg2;
            beamX.fillRect(0, 0, BW, BH);
            beamX.restore();
          }
          bg.globalCompositeOperation = "lighter";
          bg.drawImage(beamC, 0, 0);
          bg.drawImage(beamC, 0, 0);
          if (hit > 0.3) bg.drawImage(beamC, 0, 0);
          bg.globalCompositeOperation = "source-over";
        }

        /* ================= EFFECTS ================= */
        function spawnShards(cx, cy, R, n) {
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2,
              sp = 2 + Math.random() * 4.5,
              sz = 6 + Math.random() * 14,
              m = Math.random() < 0.4 ? 4 : 3,
              pts = [];
            for (let j = 0; j < m; j++) {
              const pa = (j / m) * Math.PI * 2 + Math.random() * 0.9,
                pr = sz * (0.5 + Math.random() * 0.6);
              pts.push([Math.cos(pa) * pr, Math.sin(pa) * pr]);
            }
            shards.push({
              x: cx + Math.cos(a) * R,
              y: cy + Math.sin(a) * R,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              rot: Math.random() * 6.28,
              vr: (Math.random() - 0.5) * 0.25,
              pts,
              life: 1,
            });
          }
          if (shards.length > 70) shards.splice(0, shards.length - 70);
        }
        function waveSnap() {
          const n = 72,
            o = new Float32Array(n);
          for (let i = 0; i < n; i++)
            o[i] = (wave[Math.floor((i / n) * (wave.length - 1))] - 128) / 128;
          return o;
        }

        /* ================= SPEAKER (Studio) ================= */
        let ex = 0,
          exV = 0;
        function drawSpeaker(cx, cy) {
          const Rf = S * 0.33,
            Rs = Rf * 0.86,
            Rc = Rf * 0.68,
            Rd = Rf * 0.24,
            k = 1 + ex * 0.11;
          const fr = g.createLinearGradient(cx - Rf, cy - Rf, cx + Rf, cy + Rf);
          fr.addColorStop(0, "#3b3b42");
          fr.addColorStop(0.5, "#151518");
          fr.addColorStop(1, "#2a2a30");
          g.fillStyle = fr;
          g.beginPath();
          g.arc(cx, cy, Rf, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = "rgba(255,255,255,.18)";
          g.lineWidth = 1.2;
          g.stroke();
          g.fillStyle = "#9a9aa2";
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
            g.beginPath();
            g.arc(
              cx + Math.cos(a) * Rf * 0.93,
              cy + Math.sin(a) * Rf * 0.93,
              Rf * 0.028,
              0,
              Math.PI * 2,
            );
            g.fill();
          }
          const sv = Math.round(70 + ex * 70),
            sur = g.createRadialGradient(
              cx - Rs * 0.15 * k,
              cy - Rs * 0.2 * k,
              Rc * k * 0.9,
              cx,
              cy,
              Rs * k,
            );
          sur.addColorStop(0, "#0b0b0c");
          sur.addColorStop(0.55, `rgb(${sv},${sv},${sv + 8})`);
          sur.addColorStop(1, "#08080a");
          g.fillStyle = sur;
          g.beginPath();
          g.arc(cx, cy, Rs * k, 0, Math.PI * 2);
          g.arc(cx, cy, Rc * k, 0, Math.PI * 2, true);
          g.fill();
          const cvv = Math.round(20 + ex * 30),
            cone = g.createRadialGradient(cx, cy, Rd * k, cx, cy, Rc * k);
          cone.addColorStop(0, `rgb(${cvv},${cvv},${cvv + 4})`);
          cone.addColorStop(1, "#0d0d10");
          g.fillStyle = cone;
          g.beginPath();
          g.arc(cx, cy, Rc * k, 0, Math.PI * 2);
          g.fill();
          g.lineCap = "round";
          g.lineWidth = Rf * 0.04;
          g.strokeStyle = `rgba(255,186,110,${0.35 + ex * 0.45})`;
          g.beginPath();
          g.arc(cx, cy, ((Rs + Rc) / 2) * k, -2.65, -1.95);
          g.stroke();
          g.strokeStyle = `rgba(120,170,255,${0.35 + ex * 0.45})`;
          g.beginPath();
          g.arc(cx, cy, ((Rs + Rc) / 2) * k, -1.15, -0.45);
          g.stroke();
          const dr = Rd * (1 + ex * 0.22) * k,
            dc = g.createRadialGradient(
              cx - dr * 0.35,
              cy - dr * 0.4,
              dr * 0.05,
              cx,
              cy,
              dr,
            );
          dc.addColorStop(0, "rgba(255,255,255,.75)");
          dc.addColorStop(0.35, "rgba(200,210,230,.22)");
          dc.addColorStop(1, "rgba(60,60,70,.45)");
          g.fillStyle = dc;
          g.beginPath();
          g.arc(cx, cy, dr, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = "rgba(255,255,255,.5)";
          g.lineWidth = 1.2;
          g.stroke();
          if (ex > 0.25) {
            g.strokeStyle = `rgba(255,255,255,${Math.min(0.4, (ex - 0.25) * 0.35)})`;
            g.lineWidth = 2 + ex * 6;
            g.beginPath();
            g.arc(cx, cy, Rf * (1.04 + ex * 0.25), 0, Math.PI * 2);
            g.stroke();
          }
          g.fillStyle = "#ddd";
          for (let i = coneDust.length - 1; i >= 0; i--) {
            const d = coneDust[i];
            d.x += d.vx * F;
            d.y += d.vy * F;
            d.vy += 0.25 * F;
            d.life -= 0.03 * F;
            if (d.life <= 0) {
              coneDust.splice(i, 1);
              continue;
            }
            g.globalAlpha = d.life * 0.7;
            g.fillRect(d.x, d.y, 1.8, 1.8);
          }
          g.globalAlpha = 1;
        }

        /* ================= FRAME ================= */
        const prevLow = new Uint8Array(8),
          freqS = new Float32Array(512);
        let F = 1,
          lastTs = 0,
          frameNo = 0,
          tB = 0,
          hit = 0,
          subLvl = 0,
          kickAvg = 5,
          lastHit = 0,
          shine = 0,
          flash = 0;
        let bMed = 0.3,
          bSlow = 0.3,
          eMed = 0.3,
          eSlow = 0.3,
          lowSince = 0,
          lastLow = -1e9,
          lastDrop = -1e9,
          liveSince = 0,
          wasLive = false;
        const avg = (a, i0, i1) => {
          let s = 0;
          for (let i = i0; i < i1; i++) s += a[i];
          return s / (i1 - i0);
        };

        function idleData(t) {
          // no music yet: a soft fake "808" every 1.3 s so the page isn't dead
          const k = Math.exp(-(t % 1.3) * 7);
          freq.fill(0);
          for (let i = 1; i < 6; i++) freq[i] = Math.min(255, 60 + k * 190);
          for (let i = 6; i < 200; i++)
            freq[i] = Math.max(0, 60 * k * (1 - i / 200));
          for (let i = 0; i < wave.length; i++)
            wave[i] = 128 + Math.sin(i * 0.05) * 30 * k;
        }

        function frame(ts) {
          const t = ts / 1000,
            dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
          lastTs = ts;
          F = dt * 60;
          frameNo++;
          const live =
            analyser &&
            (mode === "demo" || mode === "file" || mode === "stream");
          if (live) {
            analyser.getByteFrequencyData(freq);
            analyser.getByteTimeDomainData(wave);
          } else idleData(t);
          const now = performance.now(),
            cx = W / 2,
            cy = H * 0.45,
            base = S * 0.17;

          // ---- BASS ONLY: the real low end (≈40-120 Hz) must be loud AND jump suddenly ----
          const sub = avg(freq, 1, 4) / 255,
            gate = 0.74 - sens * 0.3;
          let fl = 0;
          for (let i = 1; i < 4; i++) {
            const d = freq[i] - prevLow[i];
            if (d > 0) fl += d;
            prevLow[i] = freq[i];
          }
          fl /= 3;
          kickAvg = kickAvg * 0.93 + fl * 0.07;
          subLvl = Math.max(0, (sub - gate) / (1 - gate));
          const isHit = live
            ? sub > gate &&
              fl > 22 - sens * 14 &&
              fl > kickAvg * 1.4 &&
              now - lastHit > 160
            : sub > 0.7 && fl > 20 && now - lastHit > 500;
          if (isHit) {
            lastHit = now;
            hit = 1;
            shine = 1;
            if (theme.kind === "tonga") {
              rings.push({
                r: base * 1.12,
                life: 1,
                shape: waveSnap(),
                spin: Math.random() * 6.28,
                amp: 1,
              });
              if (rings.length > 5) rings.shift();
            } else if (theme.kind === "studio") {
              exV += 0.35;
              for (let i = 0; i < 8; i++) {
                const a = Math.random() * 6.28,
                  r = S * 0.33 * (0.24 + Math.random() * 0.44);
                coneDust.push({
                  x: cx + Math.cos(a) * r,
                  y: cy + Math.sin(a) * r,
                  vx: (Math.random() - 0.5) * 2,
                  vy: -2 - Math.random() * 4,
                  life: 1,
                });
              }
              spawnShards(cx, cy, S * 0.33, 3);
            } else {
              ripples.push({ r: base, life: 1 });
              spawnShards(cx, cy, base, 5);
            }
          }
          const drive = Math.min(1, Math.max(subLvl * 1.2, hit * 0.9));

          // ---- DROP: the bass comes back hard after a stretch without it ----
          const energy = avg(freq, 1, 200) / 255;
          if (live && !wasLive) {
            liveSince = now;
            eMed = eSlow = energy;
            bMed = bSlow = drive;
            lastLow = -1e9;
            lowSince = 0;
          }
          wasLive = live;
          eMed += (energy - eMed) * 0.06;
          eSlow += (energy - eSlow) * 0.004;
          bMed += (drive - bMed) * 0.08;
          bSlow += (drive - bSlow) * 0.004;
          if (bMed < bSlow * 0.6) {
            if (!lowSince) lowSince = now;
            if (now - lowSince > 1200) lastLow = now;
          } else lowSince = 0;
          if (
            live &&
            bMed > bSlow * 1.08 &&
            drive > 0.5 &&
            eMed > eSlow * 1.08 &&
            now - lastLow < 7000 &&
            now - lastDrop > 10000 &&
            now - liveSince > 6000
          ) {
            lastDrop = now;
            flash = 1;
            if (theme.kind === "tonga")
              for (let k = 0; k < 3; k++)
                rings.push({
                  r: base * (1.1 + k * 0.3),
                  life: 1,
                  shape: waveSnap(),
                  spin: Math.random() * 6.28,
                  amp: 1.6,
                });
            else
              spawnShards(
                cx,
                cy,
                theme.kind === "studio" ? S * 0.33 : base,
                18,
              );
          }

          hit *= Math.pow(0.88, F);
          shine = Math.max(0, shine - 0.035 * F);
          flash *= Math.pow(0.92, F);
          tB += dt * (0.05 + hit * 1.4); // background only drifts when the bass hits
          exV += (drive * drive - ex) * 0.35 * F;
          exV *= Math.pow(0.62, F);
          ex += exV * F;
          for (let i = 0; i < freqS.length; i++) {
            const v = freq[i];
            freqS[i] += (v - freqS[i]) * (v > freqS[i] ? 0.6 : 0.18);
          }

          // ---- background ----
          if (bgDirty || frameNo % 2 === 0) {
            drawBackground(tB, drive, flash);
            bgDirty = false;
          }
          g.setTransform(DPR, 0, 0, DPR, 0, 0);
          g.imageSmoothingEnabled = true;
          g.drawImage(bgC, -14, -14, W + 28, H + 28);

          // ---- camera punch on the bass ----
          const shake = hit * 2 + flash * 12,
            z = 1 + hit * 0.025 + flash * 0.05;
          g.translate(
            cx + (Math.random() - 0.5) * shake,
            cy + (Math.random() - 0.5) * shake,
          );
          g.scale(z, z);
          g.translate(-cx, -cy);

          const R = base * (1 + drive * 0.16 + hit * 0.06);

          if (theme.kind === "tonga") {
            const rs = raysC.width * (1 + hit * 0.15);
            g.globalAlpha = Math.min(1, 0.25 + hit * 0.75 + flash * 0.5);
            g.drawImage(raysC, cx - rs / 2, cy - rs / 2, rs, rs);
            g.globalAlpha = 1;
            g.lineJoin = "round";
            for (let i = rings.length - 1; i >= 0; i--) {
              const r = rings[i];
              r.r += S * (0.004 + 0.018 * r.life * r.life) * F;
              r.life -= 0.016 * F;
              if (r.life <= 0) {
                rings.splice(i, 1);
                continue;
              }
              const n = r.shape.length,
                a2 = S * 0.05 * r.amp * r.life;
              g.strokeStyle = `rgba(255,236,226,${0.32 * r.life})`;
              g.lineWidth = 1.2 + r.life * 0.8;
              g.beginPath();
              for (let j = 0; j <= n; j++) {
                const a = r.spin + (j / n) * Math.PI * 2,
                  rr = r.r + r.shape[j % n] * a2;
                const x = cx + Math.cos(a) * rr,
                  y = cy + Math.sin(a) * rr;
                j ? g.lineTo(x, y) : g.moveTo(x, y);
              }
              g.closePath();
              g.stroke();
            }
          }
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.r += S * 0.009 * F;
            r.life -= 0.02 * F;
            if (r.life <= 0) {
              ripples.splice(i, 1);
              continue;
            }
            g.strokeStyle = `rgba(255,255,255,${r.life * 0.35})`;
            g.lineWidth = 1.5 + r.life * 3;
            g.beginPath();
            g.arc(cx, cy, r.r, 0, Math.PI * 2);
            g.stroke();
          }

          // ---- bars: small between hits, jump on the bass ----
          const N = 56,
            gap =
              theme.kind === "studio"
                ? S * 0.33 * (1 + ex * 0.03) + 12
                : R + 10,
            lift = 0.2 + 0.8 * drive;
          g.lineCap = "round";
          g.lineWidth = Math.max(4, ((Math.PI * R) / N) * 0.7);
          for (let i = 0; i < N; i++) {
            const k = i / N,
              v = (freqS[2 + Math.floor(Math.pow(k, 1.35) * 200)] / 255) * lift,
              len = base * 0.06 + v * v * base * 1.15;
            g.strokeStyle = `rgba(255,255,255,${0.16 + v * 0.34})`;
            g.beginPath();
            for (const side of [1, -1]) {
              const ang = -Math.PI / 2 + side * k * Math.PI,
                c = Math.cos(ang),
                s = Math.sin(ang);
              g.moveTo(cx + c * gap, cy + s * gap);
              g.lineTo(cx + c * (gap + len), cy + s * (gap + len));
            }
            g.stroke();
          }

          // ---- centre piece ----
          const shR = (theme.kind === "studio" ? S * 0.33 : R) * 1.45;
          g.drawImage(shadowC, cx - shR, cy - shR + S * 0.03, shR * 2, shR * 2);
          if (theme.kind === "studio") drawSpeaker(cx, cy);
          else {
            g.save();
            g.beginPath();
            g.arc(cx, cy, R, 0, Math.PI * 2);
            g.clip();
            if (theme.kind === "tonga") {
              const fs = R * 2.1,
                fx = cx - R * 1.05,
                fy = cy - R * 1.05,
                amp = R * (0.05 * drive + 0.04 * hit);
              if (amp < 0.5) g.drawImage(flagC, fx, fy, fs, fs);
              else {
                const strips = 24,
                  stw = fs / strips;
                for (let i = 0; i < strips; i++)
                  g.drawImage(
                    flagC,
                    (i * 400) / strips,
                    0,
                    400 / strips + 1,
                    400,
                    fx + i * stw,
                    fy + Math.sin(i * 0.45 - tB * 6) * amp,
                    stw + 1,
                    fs,
                  );
              }
              g.fillStyle = "rgba(255,255,255,.07)";
              g.fillRect(cx - R, cy - R, R * 2, R * 2);
            } else {
              tiny.drawImage(bgC, 0, 0, tinyC.width, tinyC.height);
              g.drawImage(tinyC, -14, -14, W + 28, H + 28);
              g.fillStyle = "rgba(255,255,255,.14)";
              g.fillRect(cx - R, cy - R, R * 2, R * 2);
            }
            const hl = g.createLinearGradient(
              cx - R,
              cy - R,
              cx + R * 0.4,
              cy + R * 0.4,
            );
            hl.addColorStop(0, "rgba(255,255,255,.38)");
            hl.addColorStop(0.45, "rgba(255,255,255,.04)");
            hl.addColorStop(1, "rgba(255,255,255,0)");
            g.fillStyle = hl;
            g.fillRect(cx - R, cy - R, R * 2, R * 2);
            if (shine > 0) {
              const p = 1 - shine;
              g.translate(cx - R * 1.6 + p * R * 3.2, cy);
              g.rotate(-0.5);
              g.fillStyle = `rgba(255,255,255,${0.3 * shine})`;
              g.fillRect(-R * 0.12, -R * 2, R * 0.24, R * 4);
            }
            g.restore();
            g.strokeStyle = `rgba(255,255,255,${0.55 + flash * 0.4})`;
            g.lineWidth = 1.5;
            g.beginPath();
            g.arc(cx, cy, R, 0, Math.PI * 2);
            g.stroke();
            // waveform inside the glass: only swings on the bass
            g.strokeStyle = "rgba(255,255,255,.85)";
            g.lineWidth = 2;
            g.lineJoin = "round";
            g.beginPath();
            const M = 120,
              wa = 0.15 + 0.85 * hit;
            for (let i = 0; i <= M; i++) {
              const a = (i / M) * Math.PI * 2,
                wv =
                  (wave[Math.floor((i / M) * (wave.length - 1))] - 128) / 128,
                rr = R * 0.55 + wv * R * 0.3 * wa;
              const x = cx + Math.cos(a) * rr,
                y = cy + Math.sin(a) * rr;
              i ? g.lineTo(x, y) : g.moveTo(x, y);
            }
            g.closePath();
            g.stroke();
          }

          // ---- glass shards ----
          for (let i = shards.length - 1; i >= 0; i--) {
            const s = shards[i];
            s.x += s.vx * F;
            s.y += s.vy * F;
            s.vx *= Math.pow(0.975, F);
            s.vy = s.vy * Math.pow(0.975, F) + 0.04 * F;
            s.rot += s.vr * F;
            s.life -= 0.018 * F;
            if (s.life <= 0) {
              shards.splice(i, 1);
              continue;
            }
            g.save();
            g.translate(s.x, s.y);
            g.rotate(s.rot);
            g.beginPath();
            s.pts.forEach((p, j) =>
              j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]),
            );
            g.closePath();
            g.fillStyle = `rgba(255,255,255,${0.22 * s.life})`;
            g.fill();
            g.strokeStyle = `rgba(255,255,255,${0.75 * s.life})`;
            g.lineWidth = 1;
            g.stroke();
            g.restore();
          }

          // ---- flash + vignette ----
          g.setTransform(DPR, 0, 0, DPR, 0, 0);
          if (flash > 0.01) {
            g.fillStyle = `rgba(255,255,255,${flash * 0.4})`;
            g.fillRect(0, 0, W, H);
          }
          g.drawImage(vigC, 0, 0, W, H);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
